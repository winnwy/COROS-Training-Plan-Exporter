<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COROS Plan Exporter</title>
    <meta name="description" content="Turn a COROS training plan into a calendar (.ics) or Garmin watch workouts (.FIT).">
    <style>
        :root{
            --ink:#0f172a; --muted:#64748b; --line:#e2e8f0;
            --accent:#ff9800; --accent-d:#fb8c00; --soft:#f8fafc;
        }
        *{box-sizing:border-box}
        body{
            margin:0; min-height:100vh; background:#fff; color:var(--ink);
            font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
            line-height:1.5; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px;
        }
        .box{width:100%; max-width:480px; text-align:center}
        .brand{font-weight:700; font-size:15px; margin-bottom:36px}
        .brand b{color:var(--accent)}
        h1{font-size:27px; line-height:1.3; letter-spacing:-.02em; font-weight:700; margin:0 0 26px}
        form{text-align:left}
        .flash{padding:12px 14px; border-radius:10px; margin-bottom:16px; font-size:14px;
            background:#fef2f2; color:#991b1b; border:1px solid #fecaca}
        input{width:100%; border:1.5px solid var(--line); border-radius:11px; padding:14px 15px;
            font-size:15px; outline:none; font-family:inherit; color:var(--ink); background:#fff}
        input:focus{border-color:var(--accent); box-shadow:0 0 0 4px rgba(255,152,0,.18)}
        input::placeholder{color:#94a3b8}
        .url{margin-bottom:10px}
        .date-row{display:flex; align-items:center; gap:10px; margin-bottom:14px}
        .date-row label{font-size:13px; color:var(--muted); white-space:nowrap}
        .date-row input{padding:10px 12px; font-size:14px}
        button{width:100%; border:0; background:var(--accent); color:#fff; font-weight:700;
            font-size:16px; padding:15px; border-radius:11px; cursor:pointer; transition:background .15s}
        button:hover{background:var(--accent-d)}
        button:focus-visible{outline:3px solid rgba(255,152,0,.5); outline-offset:2px}
    </style>
</head>
<body>
    <div class="box">
        <div class="brand">COROS Plan <b>Exporter</b></div>
        <h1>Turn your COROS plan into a calendar or Garmin workouts.</h1>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% for category, message in messages %}
            <div class="flash">{{ message }}</div>
          {% endfor %}
        {% endwith %}

        <form method="POST">
            <input class="url" type="url" name="plan_url" required
                   placeholder="Paste your COROS plan link…">
            <div class="date-row">
                <label for="start_date">Start date (optional)</label>
                <input type="date" id="start_date" name="start_date">
            </div>
            <button type="submit">Preview plan</button>
        </form>
    </div>
</body>
</html>
